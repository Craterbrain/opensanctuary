[package]
name = "os-next-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.10"

[dependencies.os-next]
path = ".."

# Use independent workspace for fuzzers
[workspace]
members = ["."]

[[bin]]
name = "pptx_import"
path = "fuzz_targets/pptx_import.rs"
test = false
doc = false
bench = false

