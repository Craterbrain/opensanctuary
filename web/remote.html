<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121316">
  <title>OpenSanctuary Remote</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    :root {
      --bg-base: #121316;
      --bg-surface: #1B1C22;
      --bg-card: #24252E;
      --bg-card-hover: #2D2F3B;
      --border-subtle: #343644;
      --border-highlight: #484B5D;
      
      --text-main: #F1F1F5;
      --text-muted: #9499AB;
      --text-dim: #65697A;
      
      --live-green: #2E7D32;
      --live-green-glow: #4CAF50;
      --stage-amber: #E65100;
      --stage-amber-glow: #FF9800;
      --blackout-red: #D32F2F;
      --clear-orange: #EF6C00;
      --logo-amber: #F57F17;
      --accent-cyan: #00E5FF;
      
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    /* --- TOP APP BAR --- */
    #top-bar {
      padding-top: var(--safe-top);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .header-row {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 8px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conn-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #757575;
      transition: background 0.3s ease;
    }
    .status-dot.connected { background: #00E676; box-shadow: 0 0 8px rgba(0,230,118,0.6); }
    .status-dot.reconnecting { background: #FF9100; animation: pulse 1s infinite; }
    .status-dot.offline { background: #FF1744; }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1.0; }
      100% { opacity: 0.4; }
    }

    .mode-pill {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--border-highlight);
      background: #282A36;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .mode-pill.prompter-mode {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    .overrides-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-override {
      cursor: pointer;
      border: none;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 9px;
      border-radius: 6px;
      background: #2A2B36;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      transition: all 0.15s ease;
    }
    .btn-override:active { transform: scale(0.94); }
    .btn-override.active-black {
      background: var(--blackout-red);
      color: #fff;
      border-color: #ff5252;
      box-shadow: 0 0 10px rgba(211, 47, 47, 0.6);
    }
    .btn-override.active-clear {
      background: var(--clear-orange);
      color: #fff;
      border-color: #ff9800;
      box-shadow: 0 0 10px rgba(239, 108, 0, 0.6);
    }
    .btn-override.active-logo {
      background: var(--logo-amber);
      color: #fff;
      border-color: #ffd600;
      box-shadow: 0 0 10px rgba(245, 127, 23, 0.6);
    }

    /* --- TABS --- */
    .tab-bar {
      display: flex;
      background: #16171D;
      border-top: 1px solid rgba(255,255,255,0.04);
      height: 38px;
    }
    .tab-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      gap: 6px;
    }
    .tab-item.active {
      color: #fff;
      border-bottom-color: var(--accent-cyan);
      background: rgba(255,255,255,0.03);
    }

    /* --- CONTENT AREA --- */
    #main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    /* --- SCHEDULE VIEW --- */
    #view-schedule {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .schedule-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .schedule-card:active {
      transform: scale(0.98);
      background: var(--bg-card-hover);
    }
    .schedule-card.is-live {
      border: 2px solid var(--live-green-glow);
      background: rgba(46, 125, 50, 0.15);
      box-shadow: 0 0 14px rgba(76, 175, 80, 0.35);
    }
    .schedule-card.is-staged {
      border: 2px solid var(--stage-amber-glow);
      background: rgba(230, 81, 0, 0.12);
    }

    .sched-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sched-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }
    .item-type-icon {
      font-size: 16px;
      line-height: 1;
    }
    .item-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sched-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }
    .sched-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .live-badge {
      background: var(--live-green);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .staged-badge {
      background: var(--stage-amber);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* --- SLIDES VIEW --- */
    #view-slides {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .current-item-banner {
      background: #1F212B;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .banner-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .banner-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .banner-author {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Mini Output Preview Card */
    .mini-preview-card {
      background: #000;
      border: 2px solid var(--border-highlight);
      border-radius: 8px;
      aspect-ratio: 16 / 9;
      max-height: 180px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 14px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      background-size: cover;
      background-position: center;
    }
    .mini-preview-card.live-glow {
      border-color: var(--live-green-glow);
      box-shadow: 0 0 16px rgba(76, 175, 80, 0.4);
    }
    .mini-preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      border-radius: 6px;
    }
    .mini-preview-text {
      position: relative;
      z-index: 2;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      white-space: pre-line;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mini-preview-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 3;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.75);
      color: var(--accent-cyan);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Slide Cards Grid */
    .slide-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .slide-card {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 90px;
      cursor: pointer;
      position: relative;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }
    .slide-card:active { transform: scale(0.96); }
    .slide-card.is-active {
      border-color: var(--live-green-glow);
      background: rgba(46, 125, 50, 0.25);
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);
    }

    .slide-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slide-idx-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
    }
    .slide-tag-pill {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      color: var(--accent-cyan);
    }
    .slide-text-preview {
      font-size: 11px;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-line;
    }

    /* Liturgical section tag styles */
    .tag-v { background: #1976D2; color: #fff; }
    .tag-c { background: #C2185B; color: #fff; }
    .tag-b { background: #F57C00; color: #fff; }
    .tag-p { background: #7B1FA2; color: #fff; }
    .tag-e { background: #455A64; color: #fff; }
    .tag-i { background: #388E3C; color: #fff; }

    /* --- PROMPTER VIEW --- */
    #view-prompter {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      justify-content: space-between;
    }
    .prompter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #191A22;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    .prompter-clock {
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: #FFA726;
    }
    .prompter-screen {
      flex: 1;
      background: #000;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-y: auto;
    }
    .prompter-lyrics {
      font-size: 6vw;
      font-weight: 800;
      line-height: 1.35;
      color: #FFF;
      white-space: pre-line;
    }
    .prompter-next-bar {
      background: #181920;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .prompter-next-label {
      font-size: 11px;
      font-weight: 800;
      color: #8A8F9E;
      letter-spacing: 1px;
    }
    .prompter-next-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* --- BOTTOM TOUCH NAVIGATION BAR --- */
    #bottom-bar {
      padding-bottom: var(--safe-bottom);
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      height: calc(64px + var(--safe-bottom));
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-left: 8px;
      padding-right: 8px;
      gap: 6px;
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      height: 48px;
      border: none;
      border-radius: 8px;
      background: #252732;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      transition: all 0.12s ease;
    }
    .nav-btn:active {
      transform: scale(0.95);
      background: #313444;
    }
    .nav-btn.btn-primary-next {
      flex: 1.4;
      background: var(--live-green);
      border-color: #4CAF50;
      color: #fff;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
    }
    .nav-btn.btn-primary-next:active {
      background: #1B5E20;
    }
    .nav-btn.btn-go-live {
      background: #FF6F00;
      border-color: #FFA000;
      color: #fff;
    }

    /* Alert Banner */
    #alert-banner {
      display: none;
      background: #C62828;
      color: #FFF;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      animation: alertPulse 1.5s infinite;
    }
    @keyframes alertPulse {
      0% { opacity: 0.85; }
      50% { opacity: 1.0; }
      100% { opacity: 0.85; }
    }

    #pairing-gate {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px;
      text-align: center;
      background: var(--bg-base);
      z-index: 999;
    }
    #pairing-gate .gate-icon { font-size: 48px; }
    #pairing-gate h2 { font-size: 20px; color: var(--text-main); }
    #pairing-gate p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.5;
    }
    #pairing-gate strong { color: var(--text-main); }
  </style>
</head>
<body>

  <!-- Shown until a valid paired-device token is confirmed; see remote_client.ts -->
  <div id="pairing-gate">
    <div class="gate-icon">🔒</div>
    <h2>Not Paired</h2>
    <p>
      On the console, open <strong>Pairing &rarr; Mobile Remote</strong> and
      scan the QR code with this device's camera to connect.
    </p>
  </div>

  <div id="remote-app" style="display: none; flex-direction: column; width: 100%; height: 100%;">

  <!-- Top App Bar -->
  <header id="top-bar">
    <div class="header-row">
      <div class="brand-group">
        <div class="conn-pill" id="conn-pill" title="Connection Status">
          <span class="status-dot" id="status-dot"></span>
          <span id="conn-text">Connecting...</span>
        </div>
        <button class="mode-pill" id="mode-toggle-btn" title="Toggle Full Control vs Prompter View">
          <span id="mode-icon">🔒</span>
          <span id="mode-label">Control</span>
        </button>
      </div>

      <div class="overrides-cluster">
        <button class="btn-override" id="btn-override-logo">LOGO</button>
        <button class="btn-override" id="btn-override-black">BLACK</button>
        <button class="btn-override" id="btn-override-clear">CLEAR</button>
      </div>
    </div>

    <!-- View Tabs -->
    <nav class="tab-bar">
      <div class="tab-item active" id="tab-schedule" data-view="view-schedule">📋 Schedule</div>
      <div class="tab-item" id="tab-slides" data-view="view-slides">📑 Slides</div>
      <div class="tab-item" id="tab-prompter" data-view="view-prompter">🎤 Prompter</div>
    </nav>
  </header>

  <!-- Live Alert Banner (if active) -->
  <div id="alert-banner"></div>

  <!-- Main Scrollable Swipe Area -->
  <main id="main-content">
    <!-- 1. Schedule View -->
    <section id="view-schedule">
      <div id="schedule-empty" style="text-align:center; padding: 30px; color: var(--text-muted);">
        Loading service schedule...
      </div>
      <div id="schedule-list"></div>
    </section>

    <!-- 2. Slides View -->
    <section id="view-slides" style="display: none;">
      <div class="current-item-banner">
        <div class="banner-left">
          <div class="banner-title" id="slides-banner-title">No Item Selected</div>
          <div class="banner-author" id="slides-banner-author"></div>
        </div>
        <button class="btn-override" id="btn-banner-live" style="background: var(--live-green); color:#fff; border-color:#4caf50;">⚡ LIVE</button>
      </div>

      <!-- Live Output Preview -->
      <div class="mini-preview-card" id="mini-preview-card">
        <div class="mini-preview-overlay"></div>
        <div class="mini-preview-tag" id="mini-preview-tag">LIVE OUTPUT</div>
        <div class="mini-preview-text" id="mini-preview-text">No active presentation</div>
      </div>

      <!-- Slide Cards Grid -->
      <div class="slide-cards-grid" id="slide-cards-grid"></div>
    </section>

    <!-- 3. Prompter View -->
    <section id="view-prompter" style="display: none;">
      <div class="prompter-header">
        <div class="prompter-clock" id="prompter-clock">00:00:00</div>
        <button class="mode-pill" id="btn-wake-lock" style="font-size: 11px;">💡 Keep Awake</button>
      </div>

      <div class="prompter-screen" id="prompter-screen">
        <div class="prompter-lyrics" id="prompter-lyrics">No live lyrics</div>
      </div>

      <div class="prompter-next-bar">
        <span class="prompter-next-label">NEXT:</span>
        <span class="prompter-next-text" id="prompter-next-text">—</span>
      </div>
    </section>
  </main>

  <!-- Bottom Touch Navigation Bar -->
  <footer id="bottom-bar">
    <button class="nav-btn" id="btn-prev-item" title="Previous Schedule Item">
      <span>⏮</span>
      <span>Item</span>
    </button>
    <button class="nav-btn" id="btn-prev-slide" title="Previous Slide">
      <span>◀</span>
      <span>Prev</span>
    </button>
    <button class="nav-btn btn-primary-next" id="btn-next-slide" title="Next Slide">
      <span>Next ▶</span>
    </button>
    <button class="nav-btn" id="btn-next-item" title="Next Schedule Item">
      <span>⏭</span>
      <span>Item</span>
    </button>
  </footer>

  </div>

  <script type="module" src="dist/remote_client.js"></script>
</body>
</html>
