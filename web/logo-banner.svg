<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="100%">
  <defs>
    <!-- Radiant Tangerine Gradient -->
    <linearGradient id="v2Tangerine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="50%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Gothic Cross Gradient -->
    <linearGradient id="v2CrossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1" />
      <stop offset="35%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <filter id="v2Glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- FRAMELESS VECTOR ARCH -->
  <g transform="translate(20, -5) scale(0.38)">
    <!-- Soft Warm Backlight -->
    <circle cx="256" cy="250" r="140" fill="url(#v2Tangerine)" opacity="0.16" filter="url(#v2Glow)" />

    <!-- Outer Structural Arch -->
    <path d="M138 410 V250 C138 160 195 90 256 60 C317 90 374 160 374 250 V410" 
          fill="none" 
          stroke="url(#v2Tangerine)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Inner Aperture Arch -->
    <path d="M198 410 V270 C198 215 224 175 256 150 C288 175 314 215 314 270 V410" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- GOTHIC CROSS -->
    <g filter="url(#v2Glow)">
      <path d="M 256 142
               C 260 156 270 163 280 161
               C 273 171 268 180 268 188
               L 268 214
               L 294 214
               C 302 214 311 209 321 202
               C 319 213 326 223 340 226
               C 326 229 319 239 321 250
               C 311 243 302 238 294 238
               L 268 238
               L 268 316
               C 268 324 273 333 280 343
               C 270 341 260 348 256 362
               C 252 348 242 341 232 343
               C 239 333 244 324 244 316
               L 244 238
               L 218 238
               C 210 238 201 243 191 250
               C 193 239 186 229 172 226
               C 186 223 193 213 191 202
               C 201 209 210 214 218 214
               L 244 214
               L 244 188
               C 244 180 239 171 232 161
               C 242 163 252 156 256 142 Z" 
            fill="url(#v2CrossGrad)" />

      <!-- Center Diamond Accent -->
      <polygon points="256,216 266,226 256,236 246,226" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(195, 102)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="60" 
          font-weight="300" 
          fill="#F1F1F4" 
          letter-spacing="0.5">Open</text>
          
    <text x="156" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="60" 
          font-weight="800" 
          fill="url(#v2Tangerine)" 
          letter-spacing="-0.5">Sanctuary</text>
  </g>

  <!-- ACCENT SUBTITLE -->
  <text x="198" y="136" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="13" 
        font-weight="600" 
        fill="#FF8A65" 
        letter-spacing="3.5">OPEN-SOURCE WORSHIP PRODUCTION</text>
</svg>
