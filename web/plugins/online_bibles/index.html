<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Online Bibles</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px 10px; font: 13px system-ui, sans-serif; color: #e8e8ec; background: transparent; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tabs button { flex: 1; opacity: 0.7; }
    .tabs button.active { opacity: 1; font-weight: 600; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    input, select { flex: 1; min-width: 0; padding: 4px 6px; border-radius: 4px; border: 1px solid #555; background: #14161b; color: inherit; }
    button { padding: 4px 9px; cursor: pointer; }
    #status { opacity: 0.8; min-height: 1.3em; margin: 4px 0; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 230px; overflow-y: auto; }
    li { padding: 5px 2px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 6px; align-items: center; }
    li .meta { flex: 1; min-width: 0; }
    li .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .sub { opacity: 0.65; font-size: 11px; }
    .hidden { display: none; }
    progress { width: 100%; }
  </style>
</head>
<body>
  <div class="tabs">
    <button type="button" id="tab-catalog" class="active">Bibles</button>
    <button type="button" id="tab-github">GitHub</button>
    <button type="button" id="tab-passage">Passage</button>
  </div>

  <!-- No <form> anywhere: a sandboxed frame can't submit one (and doesn't need to). -->
  <section id="view-catalog">
    <div class="row">
      <input id="catalog-q" type="search" placeholder="Search name or abbreviation (KJV, ESV, Reina Valera)" autocomplete="off">
    </div>
    <div class="row"><select id="catalog-lang"><option value="all">All languages</option></select></div>
    <ul id="catalog-list"></ul>
  </section>

  <section id="view-github" class="hidden">
    <div class="row"><input id="gh-repo" type="text" placeholder="owner/repo" value="arron-taylor/bible-versions" autocomplete="off"></div>
    <div class="row">
      <input id="gh-path" type="text" placeholder="folder (default: versions)" value="versions" autocomplete="off">
      <button type="button" id="gh-browse">Browse</button>
    </div>
    <ul id="gh-list"></ul>
  </section>

  <section id="view-passage" class="hidden">
    <div class="row"><input id="passage-q" type="text" placeholder="John 3:16, Psalms 23, or a whole book (Jude)" autocomplete="off"></div>
    <div class="row">
      <select id="passage-trans">
        <option value="kjv">KJV</option><option value="web">WEB</option><option value="webbe">WEB (British)</option>
        <option value="bbe">BBE</option><option value="oeb-us">OEB (US)</option><option value="oeb-cw">OEB (Commonwealth)</option>
        <option value="almeida">Almeida (Portuguese)</option><option value="clementine">Clementine (Latin)</option>
        <option value="cuv">CUV (Chinese)</option><option value="bkr">Kralická (Czech)</option><option value="cherokee">Cherokee</option>
      </select>
      <button type="button" id="passage-go">Fetch &amp; add</button>
    </div>
  </section>

  <progress id="progress" class="hidden" max="100" value="0"></progress>
  <div id="status"></div>
  <script src="bibles.js"></script>
  <script src="app.js"></script>
</body>
</html>
