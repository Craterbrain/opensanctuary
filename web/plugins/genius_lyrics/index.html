<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Genius Lyrics</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 10px; font: 13px system-ui, sans-serif; color: #e8e8ec; background: transparent; }
    #search-form { display: flex; gap: 6px; margin-bottom: 8px; }
    input[type=search] { flex: 1; padding: 5px 8px; border-radius: 4px; border: 1px solid #555; background: #14161b; color: inherit; }
    button { padding: 4px 9px; cursor: pointer; }
    #status { opacity: 0.75; min-height: 1.3em; margin-bottom: 6px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
    li { padding: 6px 4px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px; }
    .title { font-weight: 600; }
    .artist { opacity: 0.7; }
    .row { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <!-- No <form>: a sandboxed frame can't submit one (and doesn't need to). -->
  <div id="search-form">
    <input id="q" type="search" placeholder="Title or artist (e.g. Way Maker)" autocomplete="off">
    <button id="search-btn" type="button">Search</button>
  </div>
  <div id="status"></div>
  <ul id="hits"></ul>
  <script src="genius.js"></script>
  <script src="app.js"></script>
</body>
</html>
