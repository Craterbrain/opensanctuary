<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Song Lyrics</title>
  <link rel="stylesheet" href="__os/theme.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; padding: var(--os-space-6); gap: var(--os-space-4); }
    .page-head h4 { margin-bottom: var(--os-space-2); }
    .page-head p { margin: 0; font-size: var(--os-fs-sm); }
    #hits { flex: 1 1 auto; min-height: 0; }
    .thumb { flex: 0 0 auto; width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px;
             background: linear-gradient(135deg, var(--os-bg-elevated), var(--os-bg-panel)); border: 1px solid var(--os-border); border-radius: var(--os-radius-sm); }
    .actions { display: flex; gap: var(--os-space-3); flex: 0 0 auto; }
  </style>
</head>
<body>
  <div class="page-head">
    <h4>✨ Song Lyrics</h4>
    <p>Search LRCLIB (an open community lyrics database) and Genius by song title or artist (e.g. “So Much Life.Church”, “Way Maker”). Import adds the lyrics to your Songs as formatted slides. Lyrics are usually copyrighted: your church's CCLI licence covers projecting them.</p>
  </div>
  <!-- No <form>: a sandboxed frame can't submit one (and doesn't need to). -->
  <div class="form-row" id="search-form">
    <input id="q" type="search" placeholder="Song title or artist…" autocomplete="off">
    <button id="search-btn" class="btn btn-primary" type="button">Search</button>
  </div>
  <div id="status" class="status"></div>
  <ul id="hits" class="os-list"></ul>
  <script src="__os/icons.js"></script>
  <script src="__os/sdk.js"></script>
  <script src="genius.js"></script>
  <script src="app.js"></script>
</body>
</html>
