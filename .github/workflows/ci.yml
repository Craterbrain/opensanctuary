# Tests every pull request into main -- catches regressions at review time
# instead of only at release-tag time (release.yml itself runs no tests).
#
# When it runs:
#   - on every PR into main, and by hand (Actions > CI > Run workflow).
#   - NOT again on the push a merge makes: main's branch rule requires a PR to
#     be up to date with main before it merges, so the merged code is exactly
#     what the PR run tested, and a second full run would only repeat it.
#   - a PR that only touches documentation (*.md anywhere, or anything under
#     docs/) skips the three test jobs: `changes` decides, and a skipped job
#     still satisfies the branch rule's required checks (a workflow-level
#     paths-ignore wouldn't -- the checks would never report and the PR could
#     never merge).
#
# Jobs:
#   changes  -- does this PR touch anything besides documentation?
#   rust     -- cargo build/test/clippy, with the GTK/WebKit dev headers
#               BUILDING.md documents for a local build. Also needs Bun
#               installed: build.rs runs `bun run build` as part of every
#               `cargo build` (see docs/TYPECHECKING.md), so the web UI
#               bundle has to exist before the Rust server can even start.
#   frontend -- bun typecheck/build/test (web/). The test suite includes
#               Playwright-driven e2e tests, so Chromium has to be
#               installed first -- and those tests spawn a real
#               target/release/os-next (web/tests/e2e_helpers.ts), so this
#               job builds it too.
#   plugins  -- the dev copies in web/plugins/ match the opensanctuary-plugins
#               commit release packages bundle (packaging/plugins.ref).
#
# Both test jobs run inside a D-Bus session with an unlocked GNOME Keyring:
# the keyring-backed routes (plugin keyring.own/keyring.service, TLS key
# storage) need a real Secret Service, and a hosted runner has none, so
# without it those tests get a 500 from the keyring layer.
#
# Until 2026-10-21 this triggered on `master`, which isn't this repo's default
# branch -- so it had never actually run.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # a manual run always tests everything
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          if grep -qvE '(\.md$|^docs/)' <<<"$files"; then code=true; else code=false; fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust (build, test, clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DEBIAN_FRONTEND/NEEDRESTART_MODE: without these, `apt-get install` on the current
      # ubuntu-latest image can hang indefinitely -- `needrestart` (triggered by libgtk/webkit's
      # own dependencies) prompts interactively asking which services to restart, and a
      # non-TTY CI runner can never answer it. Observed directly: three consecutive runs of this
      # PR's CI hung on this exact step for 20+ minutes each before this fix.
      - name: Install system dependencies (BUILDING.md) + a keyring for the tests
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev gnome-keyring dbus

      - uses: dtolnay/rust-toolchain@stable

      # Reuses compiled dependencies between runs (keyed on Cargo.lock, the toolchain and the job), which
      # is most of each job's time. CI only -- release.yml deliberately builds from scratch, so nothing
      # cached can end up in a signed artifact.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Bun (build.rs runs `bun run build` on every cargo build)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # build.rs typechecks/bundles the web UI, which needs node_modules first.
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: cargo build
        run: cargo build --verbose

      - name: cargo test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            cargo test --verbose'

      # Informational only for now -- this repo has pre-existing clippy
      # warnings that haven't been cleaned up yet, so this doesn't fail the
      # build on them. Flip to a hard failure once that backlog is clear.
      - name: cargo clippy
        run: cargo clippy --all-targets || true

  frontend:
    name: Frontend (typecheck, build, test)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # See the `rust` job's identical step for why these two env vars matter here.
      - name: Install system dependencies (BUILDING.md) + a keyring for the tests
        working-directory: .
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev gnome-keyring dbus

      - uses: dtolnay/rust-toolchain@stable

      # Reuses compiled dependencies between runs (keyed on Cargo.lock, the toolchain and the job), which
      # is most of each job's time. CI only -- release.yml deliberately builds from scratch, so nothing
      # cached can end up in a signed artifact.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Install Playwright's browser (used by the e2e test suite)
        run: bunx playwright install --with-deps chromium

      - run: bun run typecheck

      - run: bun run build

      - name: Build the release server the e2e tests spawn (target/release/os-next)
        working-directory: .
        run: cargo build --release

      - name: bun test
        run: |
          dbus-run-session -- bash -c '
            echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            bun test'

  plugins:
    name: Bundled plugins match packaging/plugins.ref
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/fetch-plugins.sh --check
